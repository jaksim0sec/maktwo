name: Canyon V2 observer verification
on:
  push:
    branches:
      - feat/canyon-v2-shy-observer-20261115
jobs:
  observer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Observer and canyon integration tests
        run: node --test test/canyon-v2-observer.test.mjs test/observer-stealth.test.mjs test/observer-pack.test.mjs test/canyon-v2.test.mjs
