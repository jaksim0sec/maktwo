  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cef8daea52ac3872d6e549821859abddf3f8a1d9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
