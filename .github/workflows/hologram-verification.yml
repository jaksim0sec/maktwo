name: Hologram integration verification

on:
  push:
    branches:
      - feat/hologram-workspace-20261115
  workflow_dispatch:

jobs:
  node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax
        run: |
          node --check src/client/hologram-layout.js
          node --check src/client/hologram.js
          node --check src/client/game.js
          node --check src/client/input.js
          node --check src/core/inventory.js
      - name: Run full regression suite
        run: npm test

  main-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run baseline regression suite
        run: npm test
