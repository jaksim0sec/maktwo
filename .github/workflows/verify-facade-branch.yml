name: Facade Regression Comparison
on:
  push:
    branches:
      - fix/opaque-commercial-facades-20261113
jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 136e4ac5d587604f2aa8723f058e7c26955d4090
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
