<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>영원한 밤 · 단일 코어층</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif;background:#16191e;color:#e9edf2}
*{box-sizing:border-box}body{margin:0;padding:12px;min-height:100dvh}
main{max-width:1100px;margin:auto}header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-size:19px;letter-spacing:-.04em;margin:0 0 8px}small{color:#9ca8b7}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
canvas{display:block;width:100%;background:#111419;border:1px solid #35404c;border-radius:8px}#map{width:min(100%,61dvh,640px);height:auto;aspect-ratio:1}#section{height:15dvh;max-height:150px}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:5px 10px}label{display:grid;gap:2px;font-size:11px;color:#c9d4dc}label span{display:flex;justify-content:space-between;gap:4px;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;margin:0;height:16px;accent-color:#a35ad6}

.grid{display:contents}
.legend{display:flex;flex-wrap:wrap;gap:3px 12px;margin-top:5px;color:#b9c4cf;font-size:11px}
.legend span::before{content:"";width:9px;height:9px;display:inline-block;background:var(--dot);border-radius:2px;margin-right:6px}
#readout{height:15px;font-variant-numeric:tabular-nums;color:#b9c4cf;font-size:11px;margin:3px 0}
#error{color:#ff9a9a;font-size:12px;min-height:16px}
@media(max-width:700px){body{padding:7px}.layout{grid-template-columns:1fr;gap:5px}#map{width:min(100%,33dvh);height:auto}#section{height:12dvh}.controls{gap:2px 8px}h1{font-size:16px;margin-bottom:3px}header small,aside>small{display:none}}
</style>
</head>
<body>
<main>
<header><h1>단일 코어층 · XZ 평면 / XY 단면</h1><small>한 층의 구역과 호화도</small></header>
<div class="layout">
<section>
<canvas id="map" width="512" height="512" aria-label="코어층 배치와 호화도 지도"></canvas>
<canvas id="section" width="512" height="150" aria-label="선택한 Z 위치의 X-Y 수직 단면"></canvas>
<p id="readout">Z 0 · X-Y 단면</p>
<div class="legend">
<span style="--dot:#8794a0">바닥</span><span style="--dot:#e33c45">중앙 통로</span>
<span style="--dot:#25a7d7">공중정원</span><span style="--dot:#438de9">미니 통로</span>
<span style="--dot:#a35ad6">주 동선 · 호화도 1</span><span style="--dot:#6b9f73">대단지 · 밝을수록 호화</span>
</div>
</section>
<aside class="controls">
<label><span>시드 <output id="seed-value">42</output></span><input id="seed" type="range" min="0" max="9999" step="1" value="42"></label>
<label><span>가로폭 <output id="width-value">1024</output></span><input id="width" type="range" min="512" max="4096" step="64" value="1024"></label>
<label><span>층고 <output id="height-value">540</output></span><input id="height" type="range" min="180" max="900" step="6" value="540"></label>
<div class="grid" id="noise-controls"></div>
<div class="grid" id="ratio-controls"></div>
<div id="error" role="status"></div>
<small>가로폭과 층고는 시험용 기본값입니다. 지형 색은 생성기의 구역 ID와 호화도에 대응합니다.</small>
</aside>
</div>
</main>
<script type="module">
import { CORE_FLOOR_DEFAULTS, CORE_STRUCTURE, CORE_ZONE, createFloorLayout, sampleFloorRect, verticalSpansAt } from "../../src/worldgen/eternal-night-core-floor.js";

const noiseOptions = [
  ["luxuryNoiseDensity", "노이즈 밀도", 1, 0.01, "줄기 길이와 가지 수"],
  ["luxuryNoiseConcentration", "노이즈 집중도", 1, 0.01, "높을수록 선 중심에 집중"],
  ["luxuryNoiseAmplitude", "노이즈 강도", 0.20, 0.005, "호화도 증가폭의 상한"],
];
const noiseInputs = Object.fromEntries(noiseOptions.map(([key, label, max, step, help]) => {
  const item = document.createElement("label");
  item.title = help;
  const line = document.createElement("span");
  const caption = document.createElement("span");
  caption.textContent = label;
  const value = document.createElement("output");
  line.append(caption, value);
  const input = document.createElement("input");
  input.type = "range";
  input.min = "0";
  input.max = max;
  input.step = step;
  input.value = CORE_FLOOR_DEFAULTS[key];
  input.setAttribute("aria-label", label);
  value.textContent = input.value;
  input.addEventListener("input", () => { value.textContent = input.value });
  item.append(line, input);
  document.querySelector("#noise-controls").append(item);
  return [key, input];
}));

const ratioLabels = {
  centerRadius:"중앙부 반경",mainShaftRadius:"중앙 원통",gardenOffset:"정원 위치",
  gardenRadius:"정원 반경",miniShaftOffset:"미니 통로 위치",miniShaftRadius:"미니 통로 반경",
  roadHalfWidth:"동선 반폭",rimWidth:"외곽 여백",luxuryFalloff:"호화도 감소폭",
  noiseCellSize:"가지 뻗는 범위"
};
const controlHost=document.querySelector("#ratio-controls");
for (const [key, label] of Object.entries(ratioLabels)) {
  const item=document.createElement("label");
  const line=document.createElement("span");
  const caption=document.createElement("span");
  caption.textContent=label;
  const value=document.createElement("output");
  line.append(caption,value);
  const input=document.createElement("input");
  input.type="range";
  const limits={
    centerRadius:[0.18,0.3],mainShaftRadius:[0.03,0.08],gardenOffset:[0.10,0.19],
    gardenRadius:[0.015,0.065],miniShaftOffset:[0.7,0.95],miniShaftRadius:[0.02,0.065],
    roadHalfWidth:[0.01,0.055],rimWidth:[0.015,0.09],
    luxuryFalloff:[0.2,0.7],noiseCellSize:[0.03,0.25]
  }[key];
  input.min=limits[0];input.max=limits[1];input.step="0.001";
  input.value=CORE_FLOOR_DEFAULTS.ratios[key];input.dataset.ratio=key;
  value.textContent=input.value;
  input.addEventListener("input",()=>{value.textContent=input.value});
  item.append(line,input);controlHost.append(item);
}
const canvas=document.querySelector("#map"),ctx=canvas.getContext("2d",{alpha:false});
const readout=document.querySelector("#readout"),error=document.querySelector("#error");
const section=document.querySelector("#section"),sectionCtx=section.getContext("2d",{alpha:false});
const sectionImage=sectionCtx.createImageData(section.width,section.height);
const span=new Float64Array(3);
let sectionZ=0;
let layout,queued=false;
const width=canvas.width,height=canvas.height;
const zones=new Uint8Array(width*height),weights=new Float32Array(width*height);
const frame=ctx.createImageData(width,height);
const palette=[
  [17,20,25],[134,146,158],[227,60,69],[37,167,215],
  [67,141,233],[163,90,214],[0,0,0],[85,98,112]
];
function paint(){
  queued=false;
  const ratios={};
  for(const input of controlHost.querySelectorAll("input"))ratios[input.dataset.ratio]=Number(input.value);
  try{
    layout=createFloorLayout({
      width:Number(document.querySelector("#width").value),
      floorHeight:Number(document.querySelector("#height").value),
      seed:Number(document.querySelector("#seed").value),
      luxuryNoiseDensity:noiseInputs.luxuryNoiseDensity.valueAsNumber,
      luxuryNoiseConcentration:noiseInputs.luxuryNoiseConcentration.valueAsNumber,
      luxuryNoiseAmplitude:noiseInputs.luxuryNoiseAmplitude.valueAsNumber,
      ratios
    });
    error.textContent="";
  }catch(e){error.textContent=e.message;return}
  const step=layout.width/width;
  const left=layout.centerX-layout.halfWidth+step/2;
  const top=layout.centerZ-layout.halfWidth+step/2;
  sampleFloorRect(layout,left,top,width,height,zones,weights,step);
  const pixels=frame.data;
  for(let i=0;i<zones.length;i++){
    const zone=zones[i],o=i*4;
    if(zone===CORE_ZONE.DISTRICT){
      const t=weights[i];
      pixels[o]=36+Math.round(t*125);
      pixels[o+1]=70+Math.round(t*108);
      pixels[o+2]=46+Math.round(t*80);
    }else{
      const c=palette[zone];
      pixels[o]=c[0];pixels[o+1]=c[1];pixels[o+2]=c[2];
    }
    pixels[o+3]=255;
  }
  ctx.putImageData(frame,0,0);
  drawSection();
}
function drawSection(){
  if(!layout)return;
  const sw=section.width,sh=section.height,data=sectionImage.data;
  const topY=layout.floorTop,bottomY=layout.slabBottom,extent=topY-bottomY;
  for(let xPixel=0;xPixel<sw;xPixel++){
    const x=layout.centerX-layout.halfWidth+(xPixel+0.5)*layout.width/sw;
    const count=verticalSpansAt(layout,x,sectionZ,span);
    for(let yPixel=0;yPixel<sh;yPixel++){
      const y=topY-(yPixel+0.5)*extent/sh;
      const inside=count && y>=span[0] && y<span[1];
      const structure=inside?span[2]:0;
      const color=structure===CORE_STRUCTURE.MAIN_SHAFT?[227,60,69]
        :structure===CORE_STRUCTURE.MINI_SHAFT?[67,141,233]
        :structure===CORE_STRUCTURE.SLAB?[134,146,158]:[17,20,25];
      const index=(yPixel*sw+xPixel)*4;
      data[index]=color[0];data[index+1]=color[1];data[index+2]=color[2];data[index+3]=255;
    }
  }
  sectionCtx.putImageData(sectionImage,0,0);
}
function queue(){if(!queued){queued=true;requestAnimationFrame(paint)}}
document.querySelectorAll("input").forEach(input=>input.addEventListener("input",()=>{
  const output=document.querySelector("#"+input.id+"-value");
  if(output)output.textContent=input.value;
  queue();
}));
canvas.addEventListener("pointermove",event=>{
  if(!layout)return;
  const bounds=canvas.getBoundingClientRect();
  const col=Math.floor((event.clientX-bounds.left)*width/bounds.width);
  const row=Math.floor((event.clientY-bounds.top)*height/bounds.height);
  if(col<0||row<0||col>=width||row>=height)return;
  const x=(layout.centerX-layout.halfWidth+(col+0.5)*layout.width/width).toFixed(1);
  const z=(layout.centerZ-layout.halfWidth+(row+0.5)*layout.width/height).toFixed(1);
  const i=row*width+col;
  sectionZ=Number(z);drawSection();
  const names=["허공","공용 바닥","중앙 통로","공중정원","미니 통로","주 동선","대단지","중앙부"];
  readout.textContent="x "+x+" · z "+z+" · y "+layout.slabBottom+"~"+layout.floorTop+" · "+names[zones[i]]+" · 호화도 "+weights[i].toFixed(3);
});
canvas.addEventListener("pointerleave",()=>{readout.textContent="Z "+sectionZ.toFixed(1)+" · X-Y 단면 · y "+layout.slabBottom+"~"+layout.floorTop});
queue();
</script>
</body>
</html>
